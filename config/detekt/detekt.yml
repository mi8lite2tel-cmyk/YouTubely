# Applied on top of Detekt's default config (buildUponDefaultConfig = true).

config:
  validation: true

complexity:
  LongParameterList:
    # Composables routinely take many optional parameters (modifier, colors, callbacks).
    ignoreDefaultParameters: true
    # Dependency-injected constructors grow with their collaborators; that is not a smell here.
    ignoreAnnotated: ['Composable', 'Inject', 'AssistedInject']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignorePrivate: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    # Layout values inside composables (alpha, weights, fractions) are idiomatic inline.
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      # Generated by tools/color/generate-schemes.mjs
      - '**/designsystem/theme/SeedColorSchemes.kt'
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenImport:
    active: true
    imports:
      # Material 2 is not allowed: the app is Material 3 only (see CLAUDE.md, A7).
      # Note that this does not match androidx.compose.material3.*
      - value: 'androidx.compose.material.*'
        reason: 'Use androidx.compose.material3 (Material 3 Expressive) instead of Material 2.'
