name: Release

# Publish a release in the GitHub UI (tag v0.1.0, 0.1.0 or 0.1): signed APKs for both
# flavors are built and attached to it. For an existing release, run this workflow
# manually from the Actions tab with its tag. Setup and process: docs/releasing.md
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to build (e.g. v0.1.0)
        required: true

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check that the tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # Accept v0.1.0, 0.1.0 and the short form 0.1 (= 0.1.0).
          wanted="${TAG#v}"
          while [[ "$wanted" =~ ^[0-9]+(\.[0-9]+)?$ ]]; do wanted="$wanted.0"; done
          if [ "$wanted" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION in app/build.gradle.kts. Bump the version first, then release v$VERSION."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.YOUTUBELY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YOUTUBELY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YOUTUBELY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YOUTUBELY_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing YOUTUBELY_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing YOUTUBELY_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing YOUTUBELY_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing YOUTUBELY_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/releasing.md."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YOUTUBELY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          YOUTUBELY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          YOUTUBELY_KEYSTORE_PASSWORD: ${{ secrets.YOUTUBELY_KEYSTORE_PASSWORD }}
          YOUTUBELY_KEY_ALIAS: ${{ secrets.YOUTUBELY_KEY_ALIAS }}
          YOUTUBELY_KEY_PASSWORD: ${{ secrets.YOUTUBELY_KEY_PASSWORD }}
        run: ./gradlew assembleFossRelease assembleFullRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signatures and collect APKs
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          mkdir dist
          for flavor in foss full; do
            src="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            "$APKSIGNER" verify "$src"
            cp "$src" "dist/YouTubely-$VERSION-$flavor.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          CERT=$("$APKSIGNER" verify --print-certs "dist/YouTubely-$VERSION-foss.apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          {
            echo "## Скачать"
            echo
            echo "| APK | Для кого |"
            echo "|---|---|"
            echo "| \`YouTubely-$VERSION-foss.apk\` | **Рекомендуется.** Без Google Play Services |"
            echo "| \`YouTubely-$VERSION-full.apk\` | То же + (в будущем) Google Cast |"
            echo
            echo "Сертификат подписи (SHA-256): \`$CERT\`"
            echo
            echo "Контрольные суммы — в \`SHA256SUMS.txt\`."
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*.apk dist/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            # Fill in the download notes unless the author already wrote a description.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file dist/notes.md
            fi
          else
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" "${assets[@]}" \
              --title "YouTubely $VERSION" \
              --notes-file dist/notes.md \
              --generate-notes \
              "${prerelease[@]}"
          fi
